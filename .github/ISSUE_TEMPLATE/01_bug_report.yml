name: "🐛 Bug Report"
description: File a bug report or regression encountered in DuRT
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to help improve DuRT!
        Please fill out this template as accurately as possible to help us reproduce and resolve the problem.
        For general questions or feature suggestions, please head over to [GitHub Discussions](https://github.com/codeAndxv/durt-community/discussions).

  - type: dropdown
    id: macos_version
    attributes:
      label: macOS Version
      description: Select the macOS version currently running on your system
      options:
        - "macOS 15 Sequoia"
        - "macOS 14 Sonoma"
        - "macOS 13 Ventura"
        - "Earlier Version"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Hardware Architecture
      description: Select your Mac processor architecture
      options:
        - "Apple Silicon (M1 / M2 / M3 / M4 Series)"
        - "Intel-based Mac"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: DuRT App Version
      description: Found in menu bar under DuRT -> About DuRT (e.g. v3.0.0)
      placeholder: "e.g. v3.0.0"
    validations:
      required: true

  - type: dropdown
    id: audio_source
    attributes:
      label: Audio Capture Source
      description: How was audio being captured or imported when the issue occurred?
      options:
        - "Microphone Recording"
        - "System Audio Capture (ScreenCaptureKit)"
        - "Local Audio/Video File Import"
        - "N/A (UI / Settings / Cloud Delivery issue)"
    validations:
      required: true

  - type: dropdown
    id: engine_involved
    attributes:
      label: Engine / Service Provider Involved
      description: Which engine or service was selected?
      options:
        - "Native Apple Speech ASR / Apple Translation"
        - "OneASR Engine"
        - "Cloud LLM (OpenAI / DeepSeek / SiliconFlow / etc.)"
        - "Cloud Delivery (S3 / WebDAV / Notion / Webhook)"
        - "Other / None"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description & Steps to Reproduce
      description: Clearly explain what went wrong and provide exact steps to reproduce the issue.
      placeholder: |
        1. Open Workflow Studio...
        2. Click 'Start Recording'...
        3. Encountered the following error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
      placeholder: "Expected transcription subtitles to stream in floating window..."
    validations:
      required: false

  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Relevant Logs or Screenshots
      description: Attach screenshots, crash logs, or console output if applicable.
      placeholder: "Drag and drop images or paste terminal / crash logs here..."
    validations:
      required: false
